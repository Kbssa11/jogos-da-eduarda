<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Português — Suco Enriquecido</title>
<style>
  :root{
    --fundo:#FDF6FF; --roxo:#7E57C2; --verde:#43A047; --verde-claro:#E8F5E9;
    --amarelo:#FFD54F; --laranja:#FF7043; --azul:#29B6F6; --rosa:#EC407A;
    --card:#FFFFFF; --texto:#4A3B69;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--fundo);font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;color:var(--texto);}
  body{min-height:100vh;background:
    radial-gradient(circle at 10% 5%, #FFF9C4 0 90px, transparent 91px),
    radial-gradient(circle at 92% 12%, #C8E6C9 0 70px, transparent 71px),
    radial-gradient(circle at 88% 90%, #FFE0B2 0 80px, transparent 81px),
    radial-gradient(circle at 8% 92%, #B3E5FC 0 60px, transparent 61px),
    var(--fundo);}
  .tela{display:none;max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;flex-direction:column;}
  .tela.ativa{display:flex;}
  h1{font-size:1.8rem;text-align:center;color:var(--verde);margin:8px 0 2px;letter-spacing:1px;}
  .sub{text-align:center;font-size:1.05rem;margin:0 0 14px;color:#8E7CC3;}
  .menu-btn{display:flex;align-items:center;gap:12px;width:100%;border:none;border-radius:22px;
    padding:13px 16px;margin:7px 0;font-family:inherit;font-size:1.1rem;font-weight:bold;color:#fff;
    cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .1s;text-align:left;}
  .menu-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .menu-btn .emo{font-size:1.9rem;}
  .menu-btn .done{margin-left:auto;font-size:1.4rem;}
  .pag{display:inline-block;background:rgba(255,255,255,.3);border-radius:10px;padding:2px 8px;font-size:.8rem;margin-right:4px;}
  .m1{background:#EC407A;} .m2{background:#29B6F6;} .m3{background:#FFA726;} .m4{background:#26A69A;}
  .m5{background:#AB47BC;} .m6{background:#66BB6A;} .m7{background:#5C6BC0;} .m8{background:#EF5350;}
  .m9{background:#8D6E63;} .m10{background:#F06292;}
  .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .voltar{border:none;background:#EDE7F6;color:var(--roxo);font-size:1.5rem;border-radius:16px;
    width:56px;height:56px;cursor:pointer;box-shadow:0 3px 0 #D1C4E9;}
  .falar{border:none;background:var(--amarelo);font-size:1.7rem;border-radius:16px;
    width:64px;height:56px;cursor:pointer;box-shadow:0 3px 0 #F9A825;}
  .falar:active,.voltar:active{transform:translateY(3px);box-shadow:none;}
  .progresso{display:flex;gap:6px;justify-content:center;margin:4px 0 10px;font-size:1.4rem;min-height:1.8rem;flex-wrap:wrap;}
  .pergunta{background:var(--card);border-radius:24px;padding:14px 16px;text-align:center;
    font-size:1.4rem;font-weight:bold;box-shadow:0 4px 14px rgba(126,87,194,.15);margin-bottom:16px;line-height:1.35;}
  .opcoes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .opcao{flex:1;min-width:120px;max-width:230px;background:var(--card);border:5px solid #E8DEF8;border-radius:26px;
    padding:14px 10px 12px;text-align:center;cursor:pointer;transition:transform .12s;box-shadow:0 5px 0 #E8DEF8;}
  .opcao:active{transform:scale(.95);}
  .opcao .emo{font-size:3.6rem;display:block;line-height:1.1;}
  .opcao .nome{font-size:1.1rem;font-weight:bold;margin-top:6px;display:block;}
  .opcao.certa{border-color:var(--verde);background:var(--verde-claro);box-shadow:0 5px 0 var(--verde);animation:pula .5s;}
  .opcao.errada{animation:treme .4s;border-color:#EF9A9A;}
  .opcao.sel{border-color:var(--rosa);background:#FCE4EC;box-shadow:0 5px 0 var(--rosa);}
  @keyframes pula{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  .feedback{text-align:center;font-size:1.55rem;font-weight:bold;min-height:2.4rem;margin-top:14px;}
  .feedback.certo{color:var(--verde);}
  .feedback.tente{color:#FB8C00;}
  .prox{display:none;margin:18px auto 0;border:none;background:var(--roxo);color:#fff;font-family:inherit;
    font-size:1.4rem;font-weight:bold;padding:14px 34px;border-radius:20px;cursor:pointer;box-shadow:0 5px 0 #5E35B1;}
  .prox.mostrar{display:block;}
  .prox:active{transform:translateY(4px);box-shadow:none;}
  .liqui{text-align:center;font-size:5rem;margin:6px 0;}
  .copo-suco{width:110px;height:130px;margin:10px auto;border:6px solid #B39DDB;border-top-width:3px;
    border-radius:8px 8px 22px 22px;position:relative;overflow:hidden;background:#F3E5F5;}
  .suco-liquido{position:absolute;bottom:0;left:0;right:0;height:0;transition:height 1s, background .6s;}
  .girando{animation:gira .35s linear infinite;}
  @keyframes gira{0%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}100%{transform:rotate(-6deg)}}
  .pinta-linha{background:var(--card);border-radius:22px;padding:12px;margin:8px 0;box-shadow:0 4px 12px rgba(126,87,194,.12);}
  .pinta-rotulo{font-weight:bold;font-size:1.2rem;display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .pinta-itens{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .pinta-item{font-size:3rem;filter:grayscale(1) opacity(.45);cursor:pointer;transition:transform .12s, filter .2s;}
  .pinta-item:active{transform:scale(.9);}
  .pinta-item.pintado{filter:none;transform:scale(1.12);}
  .pinta-linha.completa{border:4px solid var(--verde);background:var(--verde-claro);}
  .pinta-linha.completa .pinta-rotulo::after{content:" ⭐";}
  .palavra-r{display:flex;gap:6px;justify-content:center;margin:14px 0;flex-wrap:wrap;}
  .letra{width:54px;height:62px;background:var(--card);border:4px solid #E8DEF8;border-radius:14px;
    display:flex;align-items:center;justify-content:center;font-size:1.9rem;font-weight:bold;cursor:pointer;
    box-shadow:0 4px 0 #E8DEF8;transition:transform .1s;}
  .letra:active{transform:scale(.92);}
  .letra.achou{background:var(--rosa);border-color:#C2185B;color:#fff;box-shadow:0 4px 0 #C2185B;animation:pula .5s;}
  .letra.errada{animation:treme .4s;}
  .letra.vogal{color:var(--azul);}
  .silaba-alvo{display:flex;gap:10px;justify-content:center;margin:10px 0 18px;min-height:70px;}
  .quadr{min-width:78px;height:66px;border:4px dashed #B39DDB;border-radius:14px;background:#F7F2FF;
    display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:bold;color:var(--roxo);}
  .quadr.cheio{border-style:solid;background:var(--verde-claro);border-color:var(--verde);color:var(--texto);animation:pula .4s;}
  .silaba-ops{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .sil{border:none;background:var(--azul);color:#fff;font-family:inherit;font-size:1.5rem;font-weight:bold;
    padding:14px 22px;border-radius:18px;cursor:pointer;box-shadow:0 5px 0 #0288D1;transition:transform .1s;}
  .sil:active{transform:translateY(4px);box-shadow:none;}
  .sil.usada{visibility:hidden;}
  .sil.errada{animation:treme .4s;}
  .palavras-grade{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .palavra-card{background:var(--card);border:5px solid #E8DEF8;border-radius:20px;padding:14px 18px;
    font-size:1.35rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;transition:transform .1s;letter-spacing:1px;}
  .palavra-card:active{transform:scale(.94);}
  .palavra-card.certa{border-color:var(--rosa);background:#FCE4EC;box-shadow:0 5px 0 var(--rosa);animation:pula .5s;cursor:default;}
  .palavra-card.errada{animation:treme .4s;}
  .palavra-card b{color:var(--rosa);}
  .receita-card{background:#FFFDE7;border:5px solid var(--amarelo);border-radius:24px;padding:18px;margin-top:14px;
    box-shadow:0 6px 16px rgba(0,0,0,.12);font-size:1.25rem;line-height:1.6;display:none;}
  .receita-card.mostrar{display:block;}
  .receita-card h3{margin:0 0 8px;color:#F57F17;text-align:center;font-size:1.4rem;}
  .fim-card{background:var(--card);border-radius:28px;padding:30px 20px;text-align:center;
    box-shadow:0 8px 24px rgba(126,87,194,.25);margin-top:30px;}
  .fim-card .grande{font-size:4.5rem;}
  .fim-card h2{color:var(--roxo);font-size:1.8rem;margin:10px 0;}

  .m11{background:#FFA726;} .m12{background:#26A69A;}
  .frase-box{background:var(--card);border-radius:22px;padding:18px 14px;margin:10px 0;
    font-size:1.3rem;font-weight:bold;line-height:2;text-align:center;box-shadow:0 4px 14px rgba(126,87,194,.15);}
  .lacuna{display:inline-flex;align-items:center;justify-content:center;min-width:96px;height:54px;
    border:4px dashed #B39DDB;border-radius:14px;background:#F7F2FF;margin:0 4px;vertical-align:middle;
    font-size:1.7rem;cursor:pointer;transition:transform .1s;}
  .lacuna:active{transform:scale(.94);}
  .lacuna.alvo{border-color:#F57F17;background:#FFE082;animation:pisca 1s infinite;}
  .lacuna.cheia{border-style:solid;border-color:var(--verde);background:var(--verde-claro);
    font-size:1.15rem;color:var(--texto);animation:pula .4s;}
  @keyframes pisca{0%,100%{opacity:1}50%{opacity:.5}}
  .troca-palavra{text-align:center;font-size:2.4rem;font-weight:bold;letter-spacing:3px;margin:10px 0;}
  .troca-palavra .destaque{color:var(--rosa);background:#FCE4EC;border-radius:8px;padding:0 6px;}
  .troca-palavra .nova{color:var(--verde);}
  .seta-troca{text-align:center;font-size:2rem;margin:2px 0;}

  .m13{background:#7E57C2;} .m14{background:#EF5350;}
  .grupo-pal{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .pal-grupo{background:var(--card);border:5px solid #E8DEF8;border-radius:18px;padding:14px 16px;
    font-size:1.2rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;transition:transform .1s;letter-spacing:1px;}
  .pal-grupo:active{transform:scale(.94);}
  .pal-grupo.certa{border-color:var(--rosa);background:#FCE4EC;box-shadow:0 5px 0 var(--rosa);animation:pula .5s;}
  .pal-grupo.errada{animation:treme .4s;}
  .frase-linha{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;
    box-shadow:0 4px 12px rgba(126,87,194,.12);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;}
  .frase-num{background:var(--roxo);color:#fff;border-radius:50%;width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;}
  .pal-cont{padding:7px 10px;border-radius:11px;background:#F3EFFA;font-weight:bold;font-size:1.05rem;
    cursor:pointer;transition:transform .1s;}
  .pal-cont:active{transform:scale(.9);}
  .pal-cont.contada{background:#C8E6C9;color:#1B5E20;transform:scale(1.06);}
  .contador-pal{text-align:center;font-size:2.8rem;font-weight:bold;color:var(--roxo);min-height:3.2rem;}
  .monta-frase{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:64px;
    background:#F7F2FF;border:4px dashed #B39DDB;border-radius:18px;padding:12px;margin:10px 0;align-items:center;}
  .monta-frase:empty::before{content:"TOQUE NAS PALAVRAS NA ORDEM";color:#B39DDB;font-size:.95rem;}
  .pal-posta{background:var(--verde-claro);border:3px solid var(--verde);border-radius:12px;padding:8px 12px;
    font-weight:bold;font-size:1.15rem;animation:pula .4s;}
  .pal-btn{border:none;background:var(--azul);color:#fff;font-family:inherit;font-size:1.2rem;font-weight:bold;
    padding:13px 16px;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 #0288D1;transition:transform .1s;position:relative;}
  .pal-btn:active{transform:translateY(4px);box-shadow:none;}
  .pal-btn.usada{visibility:hidden;}
  .pal-btn.errada{animation:treme .4s;}
  .pal-btn .ord{position:absolute;top:-10px;right:-8px;background:var(--amarelo);color:#5D4037;
    border-radius:50%;width:26px;height:26px;font-size:.9rem;display:flex;align-items:center;justify-content:center;}

  .m15{background:#6D4C41;} .m16{background:#00838F;}
  .palco{position:relative;height:270px;border-radius:24px;overflow:hidden;margin:8px 0;
    background:linear-gradient(180deg,#B3E5FC 0 58%,#C5E1A5 58% 100%);box-shadow:0 6px 18px rgba(0,0,0,.15);}
  .palco.casa{background:linear-gradient(180deg,#FFE0B2 0 62%,#A1887F 62% 100%);}
  .palco.noite{background:linear-gradient(180deg,#5C6BC0 0 58%,#7E57C2 58% 100%);}
  .cenario{position:absolute;bottom:34%;font-size:2.4rem;opacity:.85;}
  .ator{position:absolute;bottom:24%;font-size:4.2rem;transition:left .8s, transform .3s;}
  .ator.bara{bottom:22%;left:16%;}
  .ator.conv{bottom:22%;left:66%;}
  .balao{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid var(--roxo);
    border-radius:20px;padding:10px 14px;font-size:1.05rem;font-weight:bold;max-width:88%;text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,.2);line-height:1.35;}
  .balao::after{content:"";position:absolute;bottom:-16px;left:34px;border:9px solid transparent;border-top-color:var(--roxo);}
  .pula-anim{animation:pulinho 1s ease-in-out infinite;}
  @keyframes pulinho{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
  .balanca{animation:balanco 1.1s ease-in-out infinite;transform-origin:bottom center;}
  @keyframes balanco{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
  .brilha-anim{animation:brilho 1.2s ease-in-out infinite;}
  @keyframes brilho{0%,100%{transform:scale(1);filter:none}50%{transform:scale(1.28);filter:drop-shadow(0 0 10px gold)}}
  .treme-anim{animation:tremida .35s linear infinite;}
  @keyframes tremida{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
  .entra{animation:entrando .8s ease-out;}
  @keyframes entrando{from{transform:translateX(150px);opacity:0}to{transform:translateX(0);opacity:1}}
  .notas{position:absolute;bottom:52%;left:52%;font-size:1.8rem;animation:subir 1.6s ease-out infinite;}
  @keyframes subir{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-58px);opacity:0}}
  .ctrl-cena{display:flex;gap:10px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
  .btn-cena{border:none;background:var(--roxo);color:#fff;font-family:inherit;font-size:1.15rem;font-weight:bold;
    padding:13px 20px;border-radius:18px;cursor:pointer;box-shadow:0 5px 0 #5E35B1;}
  .btn-cena:active{transform:translateY(4px);box-shadow:none;}
  .btn-cena.repetir{background:var(--amarelo);color:#5D4037;box-shadow:0 5px 0 #F9A825;}
  .cena-num{text-align:center;font-weight:bold;color:#8E7CC3;margin-bottom:4px;}
  .ord-lista{display:flex;flex-direction:column;gap:9px;}
  .ord-item{background:var(--card);border:4px solid #E8DEF8;border-radius:16px;padding:13px 14px;
    font-size:1.05rem;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #E8DEF8;display:flex;gap:10px;align-items:center;
    text-align:left;line-height:1.3;}
  .ord-item:active{transform:scale(.97);}
  .ord-item .nord{background:#EDE7F6;color:var(--roxo);border-radius:50%;width:34px;height:34px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
  .ord-item.feita{border-color:var(--verde);background:var(--verde-claro);}
  .ord-item.feita .nord{background:var(--verde);color:#fff;}
  .ord-item.errada{animation:treme .4s;}
  .letras-slot{display:flex;gap:6px;justify-content:center;margin:10px 0;flex-wrap:wrap;}
  .ls{width:50px;height:58px;border:4px solid #B39DDB;border-radius:12px;background:#F7F2FF;
    display:flex;align-items:center;justify-content:center;font-size:1.7rem;font-weight:bold;color:var(--roxo);}
  .ls.dado{background:#EDE7F6;border-style:solid;}
  .ls.vazio{border-style:dashed;}
  .ls.ok{background:var(--verde-claro);border-color:var(--verde);color:var(--texto);animation:pula .4s;}

  .m17{background:#AB47BC;} .m18{background:#43A047;}
  .dialogo{background:var(--card);border-radius:20px;padding:14px 16px;margin:8px 0;
    box-shadow:0 4px 14px rgba(126,87,194,.15);font-size:1.05rem;line-height:1.8;}
  .dialogo .fala-b{color:var(--roxo);font-weight:bold;}
  .dialogo .vazio{display:inline-block;min-width:110px;border-bottom:3px dashed #B39DDB;text-align:center;
    font-weight:bold;color:#B39DDB;}
  .dialogo .vazio.ok{border-bottom-style:solid;border-color:var(--verde);color:var(--verde);}
  .silabas-linha{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .sil-op{border:none;background:var(--azul);color:#fff;font-family:inherit;font-size:1.25rem;font-weight:bold;
    padding:12px 15px;border-radius:14px;cursor:pointer;box-shadow:0 4px 0 #0288D1;}
  .sil-op:active{transform:translateY(3px);box-shadow:none;}
  .sil-op.usada{visibility:hidden;}
  .sil-op.errada{animation:treme .4s;}
  .fig-alvo{text-align:center;font-size:4.6rem;margin:4px 0;}
  .letras-pal{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .lp2{width:46px;height:56px;background:var(--card);border:4px solid #E8DEF8;border-radius:12px;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:bold;cursor:pointer;
    box-shadow:0 4px 0 #E8DEF8;}
  .lp2:active{transform:scale(.92);}
  .lp2.achou{background:var(--rosa);border-color:#C2185B;color:#fff;box-shadow:0 4px 0 #C2185B;animation:pula .5s;}
  .lp2.errada{animation:treme .4s;}
  .lp2.silaba-ok{background:#FFF3E0;border-color:var(--laranja);box-shadow:0 4px 0 var(--laranja);}

  /* ---- botão flutuante de apoio ---- */

  .m19{background:#5E35B1;}
  .caixa-pal{background:var(--card);border-radius:20px;padding:12px;margin:8px 0;
    box-shadow:0 4px 12px rgba(126,87,194,.14);}
  .destaque-h{color:var(--rosa);}

  .copiar-box{background:#FFFDE7;border:5px solid var(--amarelo);border-radius:22px;padding:16px 12px;
    margin:12px 0;text-align:center;box-shadow:0 5px 16px rgba(0,0,0,.12);}
  .copiar-box .rot-cop{font-size:.95rem;font-weight:bold;color:#F57F17;letter-spacing:1px;}
  .copiar-box .pal-cop{font-size:2.5rem;font-weight:bold;letter-spacing:5px;color:var(--texto);margin:8px 0 4px;
    line-height:1.2;word-break:break-word;}
  .copiar-box .sil-cop{font-size:1.15rem;font-weight:bold;color:#8E7CC3;letter-spacing:2px;}
  .btn-avancar{display:none;margin:14px auto 0;border:none;background:var(--verde);color:#fff;
    font-family:inherit;font-size:1.45rem;font-weight:bold;padding:16px 34px;border-radius:20px;
    cursor:pointer;box-shadow:0 6px 0 #2E7D32;}
  .btn-avancar.mostrar{display:block;}
  .btn-avancar:active{transform:translateY(5px);box-shadow:none;}

  .m20{background:#FB8C00;} .m21{background:#00897B;}
  .fig-nome{text-align:center;background:var(--card);border-radius:20px;padding:14px;margin:8px 0;
    box-shadow:0 4px 14px rgba(126,87,194,.15);}
  .fig-nome .im{font-size:5rem;display:block;line-height:1.1;}
  .fig-nome .cx-nome{margin:8px auto 0;min-height:48px;border:4px dashed #B39DDB;border-radius:14px;
    background:#F7F2FF;max-width:300px;display:flex;align-items:center;justify-content:center;
    font-size:1.5rem;font-weight:bold;color:#B39DDB;letter-spacing:2px;}
  .fig-nome .cx-nome.ok{border-style:solid;border-color:var(--verde);background:var(--verde-claro);color:var(--texto);animation:pula .4s;}
  .colunas-h{display:flex;gap:8px;justify-content:center;margin:10px 0;}
  .col-h{flex:1;background:var(--card);border:4px solid #E8DEF8;border-radius:16px;padding:8px 4px;min-height:130px;}
  .col-h.alvo{border-color:#F57F17;background:#FFF8E1;}
  .col-h .tit-h{text-align:center;font-size:1.4rem;font-weight:bold;color:var(--rosa);margin-bottom:6px;}

<script>
let textoFala='';
function mostrar(id){document.querySelectorAll('.tela').forEach(t=>t.classList.remove('ativa'));
  document.getElementById(id).classList.add('ativa');window.scrollTo(0,0);}
function irMenu(){pararFala();mostrar('tela-menu');}
function falar(t){try{pararFala();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.9;u.pitch=1.0;
  if(!VOZ_ESCOLHIDA)carregarVozes();
  if(VOZ_ESCOLHIDA)u.voice=VOZ_ESCOLHIDA;   /* u.lang continua pt-BR */
  speechSynthesis.speak(u);}catch(e){}}
function pararFala(){try{speechSynthesis.cancel();}catch(e){}}
function falarPergunta(){falar(textoFala);}
function tocarSom(c){try{const ctx=window._actx||(window._actx=new (window.AudioContext||window.webkitAudioContext)());
  const ns=c?[523,659,784,1046]:[220];
  ns.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
    o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+i*.13;
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+.24);o.start(t);o.stop(t+.26);});}catch(e){}}
function confete(){const f=document.getElementById('festa');f.innerHTML='';
  const es=['🌟','⭐','🎉','🍓','🍋','🍊','✨'];
  for(let i=0;i<26;i++){const s=document.createElement('span');s.className='conf';
    s.textContent=es[Math.floor(Math.random()*es.length)];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(1.6+Math.random()*1.6)+'s';
    s.style.animationDelay=(Math.random()*.4)+'s';f.appendChild(s);}
  setTimeout(()=>f.innerHTML='',3400);}
function estrelas(el,f,t){let s='';for(let i=0;i<t;i++)s+=i<f?'⭐':'▫️';el.textContent=s;}
const ELOGIOS=['MUITO BEM!','VOCÊ ACERTOU!','PARABÉNS!','QUE LEGAL!','ISSO MESMO!'];
function elogio(){return ELOGIOS[Math.floor(Math.random()*ELOGIOS.length)];}
function marcarFeito(n){document.getElementById('d'+n).textContent='⭐';}
function fimDeJogo(n){marcarFeito(n);confete();tocarSom(true);falar('Você conseguiu! Parabéns!');mostrar('tela-fim');}
function embaralhar(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);}

/* ===== J1 — suco misto (pág 4, F) ===== */
const FRUTAS=[
 {e:'🍓',n:'MORANGO',cor:'#F06292'},{e:'🍋',n:'LIMÃO',cor:'#DCE775'},
 {e:'🍊',n:'LARANJA',cor:'#FFB74D'},{e:'🍇',n:'UVA',cor:'#BA68C8'},
 {e:'🥭',n:'MANGA',cor:'#FFCA28'},{e:'🥝',n:'KIWI',cor:'#AED581'}

function abrirJogo1(){escolhidas=[];mostrar('tela-j1');

    d.onclick=()=>escolherFruta(d,f);box.appendChild(d);});
  textoFala='Escolha duas frutas para o seu suco misto!';falar(textoFala);}
function escolherFruta(el,f){
  if(el.classList.contains('sel')){el.classList.remove('sel');escolhidas=escolhidas.filter(x=>x.n!==f.n);}
  else{if(escolhidas.length>=2)return;el.classList.add('sel');escolhidas.push(f);falar(f.n);tocarSom(true);}
  document.getElementById('prox-j1').classList.toggle('mostrar',escolhidas.length===2);}

  falar('Batendo o suco de '+escolhidas[0].n+' com '+escolhidas[1].n+'!');
  setTimeout(()=>{liq.classList.remove('girando');liq.textContent='🥤';
    const s=document.getElementById('suco');
    s.style.background='linear-gradient(180deg,'+escolhidas[0].cor+','+escolhidas[1].cor+')';
    s.style.height='92%';
    const fb=document.getElementById('fb-j1');fb.textContent='⭐ QUE DELÍCIA!';fb.className='feedback certo';
    tocarSom(true);setTimeout(()=>fimDeJogo(1),1600);},1800);}

const QUIZ1=[

/* ===== J8 — crie sua receita (pág 6, nº4) ===== */

function silabaDe(letra,vogal){
  if((SEM_SILABA[letra]||[]).includes(vogal))return null;
  if(letra==='Q')return 'QU'+vogal;
  return letra+vogal;}

  document.getElementById('aba-sil').classList.toggle('ativa',qual==='sil');
  document.getElementById('aba-fon').classList.toggle('ativa',qual==='fon');

    (qual==='sil') ? 'TOQUE EM UMA SÍLABA PARA OUVIR'

  : (qual==='dou') ? 'MONTE O NÚMERO • TOQUE NA PEÇA PARA TIRAR'

        d.classList.add('falada');};
      g.appendChild(d);});
    corpo.appendChild(g);}}

let OURO={c:0,d:0,u:0};

function desenhaOuro(novo){
  const mesa=document.getElementById('mesa-ouro');
  if(!mesa)return;
  mesa.innerHTML='';
  const cols=[['c','CENTENAS','pc-placa',100],['d','DEZENAS','pc-barra',10],['u','UNIDADES','pc-cubo',1]];
  cols.forEach(([k,rot,cls])=>{
    const col=document.createElement('div');col.className='col-ouro';
    const pil=document.createElement('div');pil.className='pilha';
    for(let i=0;i<OURO[k];i++){
      const p=document.createElement('div');
      p.className=cls+((novo===k&&i===OURO[k]-1)?' pc-nova':'');
      p.onclick=()=>{if(OURO[k]>0){OURO[k]--;tocarSom(false);desenhaOuro();}};
      pil.appendChild(p);}
    const r=document.createElement('div');r.className='rot';r.textContent=rot+': '+OURO[k];
    col.appendChild(pil);col.appendChild(r);mesa.appendChild(col);});

  const total=OURO.c*100+OURO.d*10+OURO.u;
  document.getElementById('total-ouro').textContent=total;
  const partes=[];
  if(OURO.c)partes.push(OURO.c*100);
  if(OURO.d)partes.push(OURO.d*10);
  if(OURO.u)partes.push(OURO.u);
  document.getElementById('conta-ouro').textContent=partes.length>1?partes.join(' + ')+' = '+total:'';

  const bt=document.getElementById('btn-trocar');
  if(OURO.u>=10){bt.style.display='';bt.textContent='🔄 TROCAR 10 CUBINHOS POR 1 BARRA';
    bt.onclick=()=>{OURO.u-=10;OURO.d++;tocarSom(true);
      falar('Dez cubinhos viram uma barra de dez!');desenhaOuro('d');};}
  else if(OURO.d>=10){bt.style.display='';bt.textContent='🔄 TROCAR 10 BARRAS POR 1 PLACA';
    bt.onclick=()=>{OURO.d-=10;OURO.c++;tocarSom(true);
      falar('Dez barras viram uma placa de cem!');desenhaOuro('c');};}
  else bt.style.display='none';}

function porOuro(k,valor){
  const limite={c:9,d:19,u:19};
  if(OURO[k]>=limite[k])return;
  OURO[k]++;tocarSom(true);
  const total=OURO.c*100+OURO.d*10+OURO.u;
  falar(String(total));
  desenhaOuro(k);}

function limparOuro(){OURO={c:0,d:0,u:0};tocarSom(false);falar('Limpou!');desenhaOuro();}

let VOZES=[], VOZ_ESCOLHIDA=null;

/* nomes de vozes pt-BR boas, da melhor para a mais simples */
const PREFERIDAS=['luciana','francisca','camila','joana','brasil','google','microsoft','maria','fernanda'];
const MARCA_BOA=['premium','enhanced','neural','natural','siri','eloquence'];

function carregarVozes(){
  try{
    const todas=speechSynthesis.getVoices()||[];
    const lang=v=>(v.lang||'').toLowerCase().replace('_','-');
    VOZES=todas.filter(v=>lang(v).startsWith('pt-br'));            /* só português do Brasil */
    if(!VOZES.length)VOZES=todas.filter(v=>lang(v).startsWith('pt'));/* nenhuma pt-BR: aceita outra pt */
    if(!VOZES.length)VOZES=[];                                      /* nem pt: usa a padrão do aparelho */
    VOZES.sort((a,b)=>notaVoz(b)-notaVoz(a));
    let salva=null;
    try{salva=localStorage.getItem('vozEduarda');}catch(e){}
    VOZ_ESCOLHIDA=(salva&&VOZES.find(v=>v.name===salva))||VOZES[0]||null;
  }catch(e){}}

function notaVoz(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase().replace('_','-');
  let nota=0;
  if(l.startsWith('pt-br'))nota+=50;
  MARCA_BOA.forEach(m=>{if(n.includes(m))nota+=25;});
  PREFERIDAS.forEach((p,i)=>{if(n.includes(p))nota+=(PREFERIDAS.length-i)*3;});
  if(v.localService)nota+=5;          /* funciona offline */
  if(n.includes('compact'))nota-=20;  /* versão reduzida, mais robótica */
  return nota;}

function escolherVoz(nome){
  const v=VOZES.find(x=>x.name===nome);
  if(!v)return;
  VOZ_ESCOLHIDA=v;
  try{localStorage.setItem('vozEduarda',nome);}catch(e){}
  falar('Oi! Agora eu vou falar assim com você.');
  montarVozes(document.getElementById('corpo-apoio'));}

function montarVozes(corpo){
  carregarVozes();
  corpo.innerHTML='';
  const lista=document.createElement('div');lista.className='lista-voz';
  if(!VOZES.length){
    lista.innerHTML='<div class="aviso-voz">Este aparelho não tem nenhuma voz em '+
      '<b>português do Brasil</b> instalada. O app vai usar a voz padrão do sistema. '+
      'Instale a voz Luciana seguindo a dica abaixo.</div>';}
  VOZES.slice(0,12).forEach(v=>{
    const d=document.createElement('div');
    d.className='item-voz'+((VOZ_ESCOLHIDA&&v.name===VOZ_ESCOLHIDA.name)?' escolhida':'');
    const boa=MARCA_BOA.some(m=>(v.name||'').toLowerCase().includes(m));
    d.innerHTML='<span class="play">🔊</span><span class="nome-voz">'+v.name+
      '<br><span style="font-size:.72rem;color:#8E7CC3">'+(v.lang||'')+'</span></span>'+
      (boa?'<span class="selo">MELHOR</span>':'');
    d.onclick=()=>escolherVoz(v.name);
    lista.appendChild(d);});
  corpo.appendChild(lista);
  const aviso=document.createElement('div');aviso.className='aviso-voz';
  aviso.innerHTML='<b>Dica:</b> no iPad, baixe a voz <b>Luciana (Aprimorada)</b> em '+
    'Ajustes → Acessibilidade → Conteúdo Falado → Vozes → Português (Brasil). '+
    'Depois volte aqui e escolha ela na lista — fica bem mais natural.';
  corpo.appendChild(aviso);}

try{carregarVozes();speechSynthesis.onvoiceschanged=carregarVozes;}catch(e){}

/* ===== J20 — CA pág.18: nomear figuras e separar CH, LH, NH ===== */
const FIG20=[
 {im:'🕷️',p:'ARANHA',g:'NH'},{im:'🌧️',p:'CHUVA',g:'CH'},{im:'🍂',p:'FOLHA',g:'LH'},
 {im:'💅',p:'UNHA',g:'NH'},{im:'🏠',p:'TELHADO',g:'LH'},{im:'💵',p:'DINHEIRO',g:'NH'},
 {im:'👒',p:'CHAPÉU',g:'CH'},{im:'🤡',p:'PALHAÇO',g:'LH'},{im:'🍫',p:'CHOCOLATE',g:'CH'}
];
let rod20=0, fase20=0, postas20={CH:[],LH:[],NH:[]};

function abrirJogo20(){rod20=0;fase20=0;postas20={CH:[],LH:[],NH:[]};mostrar('tela-j20');montarJ20();}

function montarJ20(){
  const perg=document.getElementById('perg-j20'),area=document.getElementById('area-j20'),
        fb=document.getElementById('fb-j20'),prox=document.getElementById('prox-j20');
  area.innerHTML='';fb.textContent='';fb.className='feedback';prox.classList.remove('mostrar');
  estrelas(document.getElementById('prog-j20'),fase20===0?rod20:9,10);

  if(fase20===0){                       /* nomear a figura */
    const q=FIG20[rod20];
    perg.innerHTML='QUE FIGURA É ESTA?';
    const cx=document.createElement('div');cx.className='fig-nome';
    cx.innerHTML='<span class="im">'+q.im+'</span><div class="cx-nome" id="cx20">?</div>';
    area.appendChild(cx);
    const outras=FIG20.filter(f=>f.p!==q.p);
    const ops=document.createElement('div');ops.className='silaba-ops';
    embaralhar([q.p,outras[rod20%outras.length].p,outras[(rod20+3)%outras.length].p]).forEach(v=>{
      const b=document.createElement('button');b.className='sil';b.style.fontSize='1.05rem';b.textContent=v;
      b.onclick=()=>{if(v===q.p){
          const c=document.getElementById('cx20');c.textContent=v;c.classList.add('ok');
          tocarSom(true);falar(v+'! '+elogio());
          fb.innerHTML='⭐ '+v.replace(/(CH|LH|NH)/,'<span class="destaque-h">$1</span>');
          fb.className='feedback certo';
          ops.querySelectorAll('.sil').forEach(x=>x.onclick=null);
          prox.classList.add('mostrar');
          prox.textContent=(rod20>=FIG20.length-1)?'AGORA SEPARAR ➜':'PRÓXIMA FIGURA ➜';}
        else{b.classList.add('errada');tocarSom(false);falar('Tente de novo');
          fb.textContent='TENTE DE NOVO 💪';fb.className='feedback tente';
          setTimeout(()=>b.classList.remove('errada'),450);}};
      ops.appendChild(b);});
    area.appendChild(ops);
    textoFala='Que figura é esta? Escolha o nome certo.';falar(textoFala);}

  else{                                  /* separar nas colunas CH / LH / NH */
    const faltam=FIG20.filter(f=>!postas20[f.g].includes(f.p));
    if(!faltam.length){fb.textContent='⭐ TUDO SEPARADO!';fb.className='feedback certo';
      setTimeout(()=>fimDeJogo(20),2400);return;}
    const q=faltam[0];
    perg.innerHTML='<span style="font-size:2.6rem">'+q.im+'</span><br>ONDE MORA A PALAVRA <b>'+q.p+'</b>?';
    const cols=document.createElement('div');cols.className='colunas-h';
    ['CH','LH','NH'].forEach(g=>{const d=document.createElement('div');d.className='col-h';
      d.innerHTML='<div class="tit-h">'+g+'</div>'+
        postas20[g].map(p=>'<div class="pal-h">'+p+'</div>').join('');
      d.onclick=()=>{if(g===q.g){postas20[g].push(q.p);tocarSom(true);
          falar(q.p+', com '+g+'! '+elogio());
          fb.textContent='⭐ '+elogio();fb.className='feedback certo';
          setTimeout(()=>montarJ20(),1500);}
        else{d.classList.add('col-h');tocarSom(false);falar('Olhe as duas letrinhas da palavra');
          fb.textContent='OLHE AS LETRAS 💪';fb.className='feedback tente';}};
      cols.appendChild(d);});
    area.appendChild(cols);
    textoFala='Onde mora a palavra '+q.p+'? No cê agá, no éle agá ou no ene agá?';falar(textoFala);}}

function proxJ20(){
  rod20++;
  if(rod20>=FIG20.length)fase20=1;
  montarJ20();}

/* ===== J21 — CA pág.19: uma letra muda tudo ===== */
const PARES21=[
 {im:'🌳',p:'GALHO'},{im:'🐓',p:'GALO'},{im:'😴',p:'SONO'},
 {im:'🛏️',p:'CAMA'},{im:'💭',p:'SONHO'},{im:'🔥',p:'CHAMA'}
];
let fase21=0, achou21=0, sel21=null;

function abrirJogo21(){fase21=0;achou21=0;sel21=null;mostrar('tela-j21');montarJ21();}

function montarJ21(){
  const perg=document.getElementById('perg-j21'),area=document.getElementById('area-j21'),
        fb=document.getElementById('fb-j21'),prox=document.getElementById('prox-j21');
  area.innerHTML='';fb.textContent='';fb.className='feedback';prox.classList.remove('mostrar');
  estrelas(document.getElementById('prog-j21'),fase21,4);

  if(fase21===0){                        /* ligar palavra à imagem */
    perg.innerHTML='UMA LETRINHA MUDA TUDO!<br><small style="font-size:1rem">TOQUE NA FIGURA E DEPOIS NA PALAVRA</small>';
    achou21=0;sel21=null;
    const figs=document.createElement('div');figs.className='par-linha';figs.style.flexWrap='wrap';
    embaralhar([...PARES21]).forEach(o=>{const d=document.createElement('div');d.className='par-fig';
      d.textContent=o.im;d.dataset.p=o.p;
      d.onclick=()=>{if(d.classList.contains('ok'))return;
        figs.querySelectorAll('.par-fig').forEach(x=>x.classList.remove('sel'));
        d.classList.add('sel');sel21=o;tocarSom(true);};
      figs.appendChild(d);});
    const pals=document.createElement('div');pals.className='par-linha';pals.style.flexWrap='wrap';
    embaralhar([...PARES21]).forEach(o=>{const b=document.createElement('div');b.className='par-pal';
      b.textContent=o.p;
      b.onclick=()=>{if(b.classList.contains('ok'))return;
        if(!sel21){falar('Primeiro toque numa figura');return;}
        if(sel21.p===o.p){b.classList.add('ok');
          figs.querySelectorAll('.par-fig').forEach(x=>{if(x.dataset.p===o.p){x.classList.remove('sel');x.classList.add('ok');}});
          achou21++;sel21=null;tocarSom(true);falar(o.p+'!');
          if(achou21===PARES21.length){fb.textContent='⭐ '+elogio();fb.className='feedback certo';
            prox.classList.add('mostrar');prox.textContent='CONTINUAR ➜';}}
        else{b.classList.add('errada');tocarSom(false);falar('Essa não. Olhe bem a figura');
          fb.textContent='OLHE BEM A FIGURA 💪';fb.className='feedback tente';
          setTimeout(()=>b.classList.remove('errada'),450);}};
      pals.appendChild(b);});
    area.appendChild(figs);area.appendChild(pals);
    textoFala='Uma letrinha muda tudo! Toque numa figura e depois na palavra dela.';falar(textoFala);}

  else if(fase21===1){                   /* o dedo na segunda letra A */
    perg.innerHTML='TOQUE NA <b>SEGUNDA LETRA A</b><br>DA PALAVRA BARATINHA';
    const linha=document.createElement('div');linha.className='palavra-dedo';
    [...'BARATINHA'].forEach((ch,i)=>{const d=document.createElement('div');d.className='ld';d.textContent=ch;
      d.onclick=()=>{
        if(i===3){d.classList.add('dedo');d.textContent='👆';tocarSom(true);
          falar('Achou! O dedo está na segunda letra A.');
          setTimeout(()=>{
            linha.querySelectorAll('.ld').forEach((x,k)=>{
              if(k<3)x.classList.add('esq');
              if(k>3)x.classList.add('dir');});
            falar('Olhe! À esquerda apareceu BAR. E à direita, TINHA.');
            fb.innerHTML='⭐ <span style="color:#1976D2">BAR</span> + <span style="color:#388E3C">TINHA</span>';
            fb.className='feedback certo';
            prox.classList.add('mostrar');prox.textContent='CONTINUAR ➜';},1400);
          linha.querySelectorAll('.ld').forEach(x=>x.onclick=null);}
        else{d.classList.add('errada');tocarSom(false);falar('Essa não é a segunda letra A');
          fb.textContent='PROCURE O SEGUNDO A 💪';fb.className='feedback tente';
          setTimeout(()=>d.classList.remove('errada'),450);}};
      linha.appendChild(d);});
    area.appendChild(linha);
    textoFala='Toque na segunda letra A da palavra baratinha.';falar(textoFala);}

  else if(fase21===2){                   /* quais palavras apareceram */
    perg.innerHTML='QUE DUAS PALAVRAS APARECERAM?<br><small style="font-size:1rem">TOQUE NAS DUAS CERTAS</small>';
    let n=0;
    const ops=document.createElement('div');ops.className='silaba-ops';
    embaralhar(['BAR','TINHA','BARA','RATO']).forEach(v=>{const b=document.createElement('button');
      b.className='sil';b.textContent=v;
      b.onclick=()=>{if(b.classList.contains('usada'))return;
        if(v==='BAR'||v==='TINHA'){b.classList.add('usada');b.style.visibility='visible';
          b.style.background='var(--verde)';b.style.boxShadow='0 5px 0 #2E7D32';
          n++;tocarSom(true);falar(v+'!');
          if(n===2){fb.textContent='⭐ BAR E TINHA!';fb.className='feedback certo';
            prox.classList.add('mostrar');prox.textContent='ÚLTIMA ➜';}}
        else{b.classList.add('errada');tocarSom(false);falar('Essa não apareceu');
          fb.textContent='TENTE OUTRA 💪';fb.className='feedback tente';
          setTimeout(()=>b.classList.remove('errada'),450);}};
      ops.appendChild(b);});
    area.appendChild(ops);
    textoFala='Que duas palavras apareceram do lado do seu dedo?';falar(textoFala);}

  else{                                  /* som inicial de TIJOLO */
    perg.innerHTML='QUAL COMEÇA COM O MESMO SOM DE<br><b>🧱 TIJOLO</b>?';
    const ops=document.createElement('div');ops.className='silaba-ops';
    embaralhar(['TINHA','BAR']).forEach(v=>{const b=document.createElement('button');
      b.className='sil';b.style.fontSize='1.3rem';b.textContent=v;
      b.onclick=()=>{if(v==='TINHA'){tocarSom(true);
          falar('TI-jolo, TI-nha! Começam com o mesmo som! '+elogio());
          fb.textContent='⭐ TINHA!';fb.className='feedback certo';
          ops.querySelectorAll('.sil').forEach(x=>x.onclick=null);
          setTimeout(()=>fimDeJogo(21),3200);}
        else{b.classList.add('errada');tocarSom(false);falar('Escute de novo: TI-jolo');
          fb.textContent='ESCUTE: TI-JOLO 💪';fb.className='feedback tente';
          setTimeout(()=>b.classList.remove('errada'),450);}};
      ops.appendChild(b);});
    area.appendChild(ops);
    textoFala='Qual palavra começa com o mesmo som de tijolo?';falar(textoFala);}}

function proxJ21(){fase21++;montarJ21();}

</script>
