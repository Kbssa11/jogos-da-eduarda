<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leve ou Pesado? — Dia de Feira!</title>
<style>
  :root{
    --fundo:#FDF6FF;
    --roxo:#7E57C2;
    --leve:#29B6F6;
    --leve-claro:#E1F5FE;
    --pesado:#FF7043;
    --pesado-claro:#FFF3E0;
    --certo:#43A047;
    --amarelo:#FFD54F;
    --card:#FFFFFF;
    --texto:#4A3B69;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--fundo);font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;color:var(--texto);}
  body{min-height:100vh;background:
    radial-gradient(circle at 10% 5%, #FFECB3 0 90px, transparent 91px),
    radial-gradient(circle at 92% 12%, #B3E5FC 0 70px, transparent 71px),
    radial-gradient(circle at 88% 90%, #F8BBD0 0 80px, transparent 81px),
    radial-gradient(circle at 8% 92%, #C8E6C9 0 60px, transparent 61px),
    var(--fundo);}
  .tela{display:none;max-width:560px;margin:0 auto;padding:16px 16px 40px;min-height:100vh;flex-direction:column;}
  .tela.ativa{display:flex;}
  h1{font-size:1.9rem;text-align:center;color:var(--roxo);margin:8px 0 2px;letter-spacing:1px;}
  .sub{text-align:center;font-size:1.05rem;margin:0 0 14px;color:#8E7CC3;}

  /* ---------- MENU ---------- */
  .menu-btn{display:flex;align-items:center;gap:14px;width:100%;border:none;border-radius:22px;
    padding:16px 18px;margin:9px 0;font-family:inherit;font-size:1.25rem;font-weight:bold;color:#fff;
    cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .1s;text-align:left;}
  .menu-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
  .menu-btn .emo{font-size:2.2rem;}
  .menu-btn .done{margin-left:auto;font-size:1.6rem;}
  .m1{background:#29B6F6;} .m2{background:#AB47BC;} .m3{background:#FF7043;} .m4{background:#66BB6A;} .m5{background:#FFA726;}

  /* ---------- BARRA SUPERIOR ---------- */
  .topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .voltar{border:none;background:#EDE7F6;color:var(--roxo);font-size:1.5rem;border-radius:16px;
    width:56px;height:56px;cursor:pointer;box-shadow:0 3px 0 #D1C4E9;}
  .falar{border:none;background:var(--amarelo);font-size:1.7rem;border-radius:16px;
    width:64px;height:56px;cursor:pointer;box-shadow:0 3px 0 #F9A825;}
  .falar:active,.voltar:active{transform:translateY(3px);box-shadow:none;}
  .progresso{display:flex;gap:6px;justify-content:center;margin:4px 0 10px;font-size:1.4rem;min-height:1.8rem;}

  /* ---------- PERGUNTA ---------- */
  .pergunta{background:var(--card);border-radius:24px;padding:14px 16px;text-align:center;
    font-size:1.5rem;font-weight:bold;box-shadow:0 4px 14px rgba(126,87,194,.15);margin-bottom:16px;line-height:1.35;}
  .pergunta .tag-leve{color:var(--leve);}
  .pergunta .tag-pesado{color:var(--pesado);}

  .opcoes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .opcao{flex:1;min-width:130px;max-width:220px;background:var(--card);border:5px solid #E8DEF8;border-radius:26px;
    padding:18px 8px 12px;text-align:center;cursor:pointer;transition:transform .12s;box-shadow:0 5px 0 #E8DEF8;}
  .opcao:active{transform:scale(.95);}
  .opcao .emo{font-size:4.6rem;display:block;line-height:1.1;}
  .opcao .nome{font-size:1.15rem;font-weight:bold;margin-top:6px;display:block;}
  .opcao.certa{border-color:var(--certo);background:#E8F5E9;box-shadow:0 5px 0 var(--certo);animation:pula .5s;}
  .opcao.errada{animation:treme .4s;border-color:#EF9A9A;}
  @keyframes pula{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes treme{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

  .feedback{text-align:center;font-size:1.7rem;font-weight:bold;min-height:2.4rem;margin-top:14px;}
  .feedback.certo{color:var(--certo);}
  .feedback.tente{color:#FB8C00;}

  .prox{display:none;margin:18px auto 0;border:none;background:var(--roxo);color:#fff;font-family:inherit;
    font-size:1.4rem;font-weight:bold;padding:14px 34px;border-radius:20px;cursor:pointer;box-shadow:0 5px 0 #5E35B1;}
  .prox.mostrar{display:block;}
  .prox:active{transform:translateY(4px);box-shadow:none;}

  /* botões LEVE / PESADO gigantes */
  .lp-botoes{display:flex;gap:16px;justify-content:center;margin-top:6px;}
  .lp{flex:1;max-width:230px;border:none;border-radius:26px;padding:20px 10px;font-family:inherit;
    font-size:1.6rem;font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);}
  .lp:active{transform:translateY(4px);box-shadow:none;}
  .lp-leve{background:var(--leve);}
  .lp-pesado{background:var(--pesado);}
  .lp .mini{display:block;font-size:2.4rem;}
  .cena{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin:6px 0 18px;}
  .cena .item{text-align:center;background:var(--card);border-radius:22px;padding:14px 18px;box-shadow:0 4px 12px rgba(126,87,194,.15);}
  .cena .item .emo{font-size:4.2rem;display:block;}
  .cena .item .nome{font-weight:bold;font-size:1.1rem;}

  /* ---------- ORDENAR 1 A 5 ---------- */
  .ordem-grade{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;}
  .ordem-item{width:135px;background:var(--card);border:5px solid #E8DEF8;border-radius:22px;padding:12px 6px;
    text-align:center;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;position:relative;transition:transform .12s;}
  .ordem-item:active{transform:scale(.95);}
  .ordem-item .emo{font-size:3.6rem;display:block;}
  .ordem-item .nome{font-size:1rem;font-weight:bold;}
  .ordem-item .num{position:absolute;top:-16px;right:-10px;width:44px;height:44px;border-radius:50%;
    background:var(--certo);color:#fff;font-size:1.5rem;font-weight:bold;display:none;align-items:center;justify-content:center;
    box-shadow:0 3px 6px rgba(0,0,0,.25);}
  .ordem-item.feito{border-color:var(--certo);background:#E8F5E9;cursor:default;}
  .ordem-item.feito .num{display:flex;}
  .ordem-item.errada{animation:treme .4s;}

  /* ---------- POTES ---------- */
  .potes{display:flex;gap:14px;justify-content:center;align-items:flex-end;margin:4px 0 16px;}
  .pote{text-align:center;background:var(--card);border:5px solid #E8DEF8;border-radius:22px;
    padding:12px 10px;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;transition:transform .12s;}
  .pote:active{transform:scale(.95);}
  .pote .lapis{font-size:1.6rem;letter-spacing:-6px;display:block;max-width:120px;line-height:1.15;}
  .pote .copo{font-size:2.6rem;display:block;}
  .pote .rotulo{font-weight:bold;margin-top:4px;display:block;font-size:1.05rem;}
  .pote.certa{border-color:var(--certo);background:#E8F5E9;animation:pula .5s;}
  .pote.marc-x::after{content:"✖";color:var(--roxo);font-size:2rem;font-weight:bold;}
  .pote.marc-bola::after{content:"●";color:var(--texto);font-size:2rem;}
  .pote.marc-azul{border-color:var(--leve);box-shadow:0 5px 0 var(--leve);}
  .pote.marc-verde{border-color:var(--certo);box-shadow:0 5px 0 var(--certo);}
  .pote.errada{animation:treme .4s;}

  /* ---------- FESTA ---------- */

  .pag{display:inline-block;background:rgba(255,255,255,.3);border-radius:10px;padding:2px 8px;font-size:.78rem;margin-right:4px;}
  .menu-btn{font-size:1.1rem !important;padding:13px 16px !important;}
  .m6{background:#26A69A;} .m7{background:#EC407A;}
  .lista-itens{display:flex;flex-direction:column;gap:10px;align-items:stretch;}
  .item-lista{background:var(--card);border:5px solid #E8DEF8;border-radius:20px;padding:14px 16px;
    font-size:1.15rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;transition:transform .1s;
    display:flex;align-items:center;gap:12px;text-align:left;line-height:1.3;}
  .item-lista:active{transform:scale(.97);}
  .item-lista .ic{font-size:2.1rem;flex-shrink:0;}
  .item-lista.certa{border-color:var(--certo);background:#E8F5E9;box-shadow:0 5px 0 var(--certo);animation:pula .5s;}
  .item-lista.errada{animation:treme .4s;border-color:#EF9A9A;}
  .barra-fora{background:#EDE7F6;border-radius:20px;height:38px;overflow:hidden;margin:12px 0 6px;box-shadow:inset 0 2px 6px rgba(0,0,0,.12);}
  .barra-dentro{height:100%;width:0;background:linear-gradient(90deg,#66BB6A,#FFD54F);transition:width .7s;
    display:flex;align-items:center;justify-content:flex-end;padding-right:10px;font-size:1.3rem;}
  .meta{text-align:center;font-size:3.6rem;margin:4px 0;transition:transform .5s;}
  .meta.conquistada{transform:scale(1.3);}
  .cofre{text-align:center;font-size:4.6rem;margin:8px 0;}
  .moedas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .moeda{font-size:2.6rem;cursor:pointer;filter:grayscale(1) opacity(.4);transition:transform .15s, filter .25s;}
  .moeda:active{transform:scale(.9);}
  .moeda.guardada{filter:none;transform:translateY(-6px) scale(1.15);}
  .contador{text-align:center;font-size:2.6rem;font-weight:bold;color:var(--roxo);min-height:3rem;}

  .m8{background:#5C6BC0;}
  .quadro{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:var(--card);
    padding:8px;border-radius:18px;box-shadow:0 4px 14px rgba(126,87,194,.15);margin:8px 0;}
  .cel{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:7px;
    background:#F3EFFA;font-size:.82rem;font-weight:bold;color:var(--texto);}
  .cel.dezena{background:#D1C4E9;color:#4527A0;}
  .cel.vazia{background:#FFF9C4;border:2px dashed #FBC02D;color:transparent;}
  .cel.alvo{background:#FFE082;border:3px solid #F57F17;animation:pisca 1s infinite;}
  .cel.preenchida{background:#C8E6C9;border:2px solid var(--certo);color:var(--texto);animation:pula .5s;}
  .cel.partida{background:#B3E5FC;border:3px solid #0288D1;color:#01579B;}
  .cel.tocavel{cursor:pointer;}
  .cel.tocavel:active{transform:scale(.9);}
  @keyframes pisca{0%,100%{opacity:1}50%{opacity:.45}}
  .num-ops{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:12px;}
  .num-btn{border:none;background:var(--roxo);color:#fff;font-family:inherit;font-size:1.8rem;font-weight:bold;
    padding:14px 26px;border-radius:18px;cursor:pointer;box-shadow:0 5px 0 #5E35B1;transition:transform .1s;}
  .num-btn:active{transform:translateY(4px);box-shadow:none;}
  .num-btn.errada{animation:treme .4s;}
  .num-btn.usada{visibility:hidden;}

  .m9{background:#FF7043;} .m10{background:#8D6E63;}
  .cartas{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  .carta{background:var(--card);border:4px solid #E8DEF8;border-radius:16px;min-width:64px;padding:16px 8px;
    font-size:1.55rem;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;transition:transform .1s;}
  .carta:active{transform:scale(.92);}
  .carta.pintada{background:#FFE082;border-color:#F57F17;box-shadow:0 5px 0 #F57F17;animation:pula .5s;}
  .carta.circulada{background:#B3E5FC;border-color:#0288D1;border-radius:50%;box-shadow:0 5px 0 #0288D1;animation:pula .5s;}
  .carta.usada{visibility:hidden;}
  .carta.errada{animation:treme .4s;}
  .slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0;}
  .slot{min-width:64px;height:66px;border:4px dashed #B39DDB;border-radius:16px;background:#F7F2FF;
    display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:bold;color:var(--roxo);}
  .slot.cheio{border-style:solid;background:#E8F5E9;border-color:var(--certo);color:var(--texto);animation:pula .4s;}
  .labirinto{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--card);
    padding:10px;border-radius:18px;box-shadow:0 4px 14px rgba(126,87,194,.15);margin:6px 0;}
  .lab-cel{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;
    background:#F3EFFA;font-size:1.05rem;font-weight:bold;cursor:pointer;transition:transform .1s;}
  .lab-cel:active{transform:scale(.9);}
  .lab-cel.pintada{background:linear-gradient(135deg,#66BB6A,#FFD54F);color:#fff;animation:pula .4s;}
  .lab-cel.errada{animation:treme .4s;background:#FFCDD2;}
  .lab-setas{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;text-align:center;font-size:1.3rem;}
  .barras{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin:14px 0;}
  .barra-item{text-align:center;cursor:pointer;}
  .barra-item:active{transform:scale(.94);}
  .barra-col{width:74px;background:linear-gradient(180deg,#9575CD,#7E57C2);border-radius:12px 12px 0 0;
    display:flex;align-items:flex-start;justify-content:center;color:#fff;font-weight:bold;font-size:1.3rem;
    padding-top:6px;transition:height .6s;}
  .barra-item.certa .barra-col{background:linear-gradient(180deg,#66BB6A,#43A047);}
  .barra-item.errada{animation:treme .4s;}
  .barra-item .rot{font-size:2.2rem;display:block;margin-top:4px;}
  .barra-item .lab{font-weight:bold;font-size:.95rem;display:block;}
  .liga-area{display:flex;gap:14px;justify-content:center;}
  .liga-col{display:flex;flex-direction:column;gap:10px;flex:1;max-width:210px;}
  .liga-btn{background:var(--card);border:4px solid #E8DEF8;border-radius:16px;padding:14px 8px;
    font-size:1.15rem;font-weight:bold;cursor:pointer;box-shadow:0 4px 0 #E8DEF8;text-align:center;transition:transform .1s;}
  .liga-btn:active{transform:scale(.95);}
  .liga-btn.num{font-size:1.7rem;}
  .liga-btn.sel{border-color:var(--rosa);background:#FCE4EC;box-shadow:0 4px 0 var(--rosa);}
  .liga-btn.certa{border-color:var(--certo);background:#E8F5E9;box-shadow:0 4px 0 var(--certo);}
  .liga-btn.errada{animation:treme .4s;}

  .m11{background:#7CB342;} .m12{background:#D81B60;}
  .dourado{display:flex;gap:16px;justify-content:center;align-items:flex-end;background:var(--card);
    border-radius:20px;padding:16px;margin:8px 0;box-shadow:0 4px 14px rgba(126,87,194,.15);min-height:130px;}
  .grupo-d{display:flex;gap:5px;align-items:flex-end;flex-wrap:wrap;max-width:60%;justify-content:center;}
  .barra-dez{width:15px;height:104px;background:repeating-linear-gradient(180deg,#FFB300 0 9px,#F57C00 9px 10px);
    border:2px solid #E65100;border-radius:3px;}
  .grupo-u{display:flex;gap:4px;flex-wrap:wrap;max-width:96px;}
  .cubo-un{width:17px;height:17px;background:#FFB300;border:2px solid #E65100;border-radius:3px;}
  .rot-du{text-align:center;font-weight:bold;font-size:.95rem;color:#E65100;margin-top:4px;}
  .tabela-du{display:flex;gap:0;justify-content:center;margin:12px 0;}
  .col-du{border:3px solid var(--roxo);min-width:76px;}
  .col-du .cab{background:#D1C4E9;color:#4527A0;font-weight:bold;font-size:1.3rem;padding:6px;text-align:center;
    border-bottom:3px solid var(--roxo);}
  .col-du .val{font-size:2.2rem;font-weight:bold;padding:12px;text-align:center;min-height:64px;}
  .col-du .val.cheio{background:#E8F5E9;color:var(--certo);animation:pula .4s;}
  .arvore{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:8px 0;}
  .maca{width:82px;height:82px;border-radius:50% 50% 46% 46%;background:var(--card);border:4px solid #E8DEF8;
    display:flex;align-items:center;justify-content:center;font-size:.98rem;font-weight:bold;cursor:pointer;
    position:relative;box-shadow:0 4px 0 #E8DEF8;transition:transform .1s;text-align:center;padding:4px;}
  .maca::before{content:"🍃";position:absolute;top:-14px;font-size:1.05rem;}
  .maca:active{transform:scale(.92);}
  .maca.alvo{border-color:#F57F17;background:#FFF8E1;animation:pisca 1s infinite;}
  .maca.feita{color:#fff;border-color:rgba(0,0,0,.18);animation:pula .5s;}
  .maca.errada{animation:treme .4s;}
  .sentenca{text-align:center;font-size:2rem;font-weight:bold;color:var(--roxo);min-height:2.6rem;margin:8px 0;}

  .m13{background:#00897B;} .m14{background:#F4511E;}
  .caixa-pontos{background:var(--card);border:4px solid #B39DDB;border-radius:26px;padding:12px;
    margin:8px auto;max-width:420px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;min-height:64px;align-items:center;}
  .ponto{width:19px;height:19px;border-radius:50%;background:var(--roxo);}
  .ponto.novo{background:var(--certo);animation:pula .4s;}
  .conta-linha{display:flex;gap:8px;justify-content:center;align-items:center;margin:12px 0;
    font-size:2rem;font-weight:bold;flex-wrap:wrap;}
  .cx-num{min-width:76px;height:64px;border:4px solid var(--roxo);border-radius:12px;background:var(--card);
    display:flex;align-items:center;justify-content:center;font-size:1.9rem;}
  .cx-num.vazia{border-style:dashed;background:#FFF9C4;animation:pisca 1s infinite;}
  .cx-num.cheia{background:#E8F5E9;border-color:var(--certo);color:var(--certo);animation:pula .4s;}
  .bichos{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:10px 0;}
  .bicho{background:var(--card);border:5px solid #E8DEF8;border-radius:22px;padding:12px 10px;width:132px;
    text-align:center;cursor:pointer;box-shadow:0 5px 0 #E8DEF8;transition:transform .1s;}
  .bicho:active{transform:scale(.94);}
  .bicho .an{font-size:3.2rem;display:block;}
  .bicho .ct{font-size:1.25rem;font-weight:bold;background:#F3EFFA;border-radius:12px;padding:5px;margin-top:6px;display:block;}
  .bicho.sel{border-color:var(--rosa);background:#FCE4EC;box-shadow:0 5px 0 var(--rosa);}
  .bicho.par{color:#fff;border-color:rgba(0,0,0,.15);animation:pula .5s;}
  .bicho.par .ct{background:rgba(255,255,255,.3);color:#fff;}
  .bicho.errada{animation:treme .4s;}

  .m15{background:#26C6DA;} .m16{background:#8E24AA;} .m17{background:#EF6C00;}
  .roda{background:var(--card);border-radius:22px;padding:14px 10px;margin:8px 0;
    box-shadow:0 4px 14px rgba(126,87,194,.15);display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;align-items:center;min-height:80px;}
  .crianca{font-size:2.5rem;cursor:pointer;transition:transform .12s;filter:grayscale(.15);}
  .crianca:active{transform:scale(.9);}
  .crianca.contada{filter:none;transform:scale(1.15);text-shadow:0 0 10px #FFD54F;}
  .crianca.nova{animation:pula .5s;}
  .rot-roda{text-align:center;font-weight:bold;color:var(--roxo);margin-top:4px;font-size:1.05rem;}
  .alvo-dardo{width:120px;height:120px;position:relative;margin:0 auto;}
  .anel{position:absolute;border-radius:50%;border:2px solid #4A3B69;left:50%;top:50%;transform:translate(-50%,-50%);}
  .a1{width:120px;height:120px;background:#5C6BC0;}
  .a2{width:88px;height:88px;background:#9FA8DA;}
  .a3{width:58px;height:58px;background:#5C6BC0;}
  .a4{width:30px;height:30px;background:#FFD54F;}
  .valor{position:absolute;left:50%;transform:translateX(-50%);font-size:.72rem;font-weight:bold;color:#fff;}
  .dardo{position:absolute;font-size:1.5rem;transform:translate(-50%,-50%);}
  .placar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:8px 0;}
  .jog{background:var(--card);border:5px solid #E8DEF8;border-radius:20px;padding:10px 8px;width:140px;
    text-align:center;box-shadow:0 5px 0 #E8DEF8;}
  .jog .nome-j{font-weight:bold;font-size:1.05rem;margin-top:6px;display:block;}
  .jog .pts{font-size:1.5rem;font-weight:bold;color:var(--roxo);display:block;min-height:1.8rem;}
  .jog.certa{border-color:var(--certo);background:#E8F5E9;box-shadow:0 5px 0 var(--certo);animation:pula .5s;}
  .jog.errada{animation:treme .4s;}
  .jog.tocavel{cursor:pointer;}
  .jog.tocavel:active{transform:scale(.95);}

function falar(txt){try{pararFala();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=.9;u.pitch=1.0;
  if(!VOZ_ESCOLHIDA)carregarVozes();
  if(VOZ_ESCOLHIDA)u.voice=VOZ_ESCOLHIDA;   /* u.lang continua pt-BR */
  speechSynthesis.speak(u);}catch(e){}}

  const notas=certo?[523,659,784,1046]:[220];
  notas.forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=f;
    o.connect(g);g.connect(ctx.destination);const t=ctx.currentTime+i*.13;
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+.24);o.start(t);o.stop(t+.26);});}catch(e){}}

function silabaDe(letra,vogal){
  if((SEM_SILABA[letra]||[]).includes(vogal))return null;
  if(letra==='Q')return 'QU'+vogal;
  return letra+vogal;}

  document.getElementById('aba-sil').classList.toggle('ativa',qual==='sil');
  document.getElementById('aba-fon').classList.toggle('ativa',qual==='fon');

    (qual==='sil') ? 'TOQUE EM UMA SÍLABA PARA OUVIR'

  : (qual==='dou') ? 'MONTE O NÚMERO • TOQUE NA PEÇA PARA TIRAR'
  : 'TOQUE PARA OUVIR E ESCOLHER A VOZ';
  corpo.innerHTML='';
  if(qual==='dou'){montarOuro(corpo);return;}
  if(qual==='voz'){montarVozes(corpo);return;}

/* ===== escolha da melhor voz disponível ===== */
let VOZES=[], VOZ_ESCOLHIDA=null;

/* nomes de vozes pt-BR boas, da melhor para a mais simples */
const PREFERIDAS=['luciana','francisca','camila','joana','brasil','google','microsoft','maria','fernanda'];
const MARCA_BOA=['premium','enhanced','neural','natural','siri','eloquence'];

function carregarVozes(){
  try{
    const todas=speechSynthesis.getVoices()||[];
    const lang=v=>(v.lang||'').toLowerCase().replace('_','-');
    VOZES=todas.filter(v=>lang(v).startsWith('pt-br'));            /* só português do Brasil */
    if(!VOZES.length)VOZES=todas.filter(v=>lang(v).startsWith('pt'));/* nenhuma pt-BR: aceita outra pt */
    if(!VOZES.length)VOZES=[];                                      /* nem pt: usa a padrão do aparelho */
    VOZES.sort((a,b)=>notaVoz(b)-notaVoz(a));
    let salva=null;
    try{salva=localStorage.getItem('vozEduarda');}catch(e){}
    VOZ_ESCOLHIDA=(salva&&VOZES.find(v=>v.name===salva))||VOZES[0]||null;
  }catch(e){}}

function notaVoz(v){
  const n=(v.name||'').toLowerCase(), l=(v.lang||'').toLowerCase().replace('_','-');
  let nota=0;
  if(l.startsWith('pt-br'))nota+=50;
  MARCA_BOA.forEach(m=>{if(n.includes(m))nota+=25;});
  PREFERIDAS.forEach((p,i)=>{if(n.includes(p))nota+=(PREFERIDAS.length-i)*3;});
  if(v.localService)nota+=5;          /* funciona offline */
  if(n.includes('compact'))nota-=20;  /* versão reduzida, mais robótica */
  return nota;}

function escolherVoz(nome){
  const v=VOZES.find(x=>x.name===nome);
  if(!v)return;
  VOZ_ESCOLHIDA=v;
  try{localStorage.setItem('vozEduarda',nome);}catch(e){}
  falar('Oi! Agora eu vou falar assim com você.');
  montarVozes(document.getElementById('corpo-apoio'));}

function montarVozes(corpo){
  carregarVozes();
  corpo.innerHTML='';
  const lista=document.createElement('div');lista.className='lista-voz';
  if(!VOZES.length){
    lista.innerHTML='<div class="aviso-voz">Este aparelho não tem nenhuma voz em '+
      '<b>português do Brasil</b> instalada. O app vai usar a voz padrão do sistema. '+
      'Instale a voz Luciana seguindo a dica abaixo.</div>';}
  VOZES.slice(0,12).forEach(v=>{
    const d=document.createElement('div');
    d.className='item-voz'+((VOZ_ESCOLHIDA&&v.name===VOZ_ESCOLHIDA.name)?' escolhida':'');
    const boa=MARCA_BOA.some(m=>(v.name||'').toLowerCase().includes(m));
    d.innerHTML='<span class="play">🔊</span><span class="nome-voz">'+v.name+
      '<br><span style="font-size:.72rem;color:#8E7CC3">'+(v.lang||'')+'</span></span>'+
      (boa?'<span class="selo">MELHOR</span>':'');
    d.onclick=()=>escolherVoz(v.name);
    lista.appendChild(d);});
  corpo.appendChild(lista);
  const aviso=document.createElement('div');aviso.className='aviso-voz';
  aviso.innerHTML='<b>Dica:</b> no iPad, baixe a voz <b>Luciana (Aprimorada)</b> em '+
    'Ajustes → Acessibilidade → Conteúdo Falado → Vozes → Português (Brasil). '+
    'Depois volte aqui e escolha ela na lista — fica bem mais natural.';
  corpo.appendChild(aviso);}

        d.classList.add('sel');tocarSom(true);falar('Você gosta de '+a.n.toLowerCase()+'! Que legal!');
        fb.textContent='⭐ '+a.n+'!';fb.className='feedback certo';
        prox.classList.add('mostrar');prox.textContent='CONTINUAR ➜';};
      ops.appendChild(d);});
    area.appendChild(ops);
    textoFala='A tabela está completa! Qual é o seu animal preferido? Não tem resposta errada.';falar(textoFala);}

  else{                                  /* os dois que mais aparecem */
    perg.innerHTML='QUAIS SÃO OS <b>DOIS</b> ANIMAIS QUE<br>MAIS APARECEM NA VIZINHANÇA?';
    let achou=0;
    const ops=document.createElement('div');ops.className='opcoes';
    embaralhar8([...PESQ]).forEach(a=>{const d=document.createElement('div');d.className='opcao';
      d.style.minWidth='96px';d.style.maxWidth='110px';
      d.innerHTML='<span class="emo" style="font-size:2.4rem">'+a.ic+'</span><span class="nome">'+a.n+
                  '<br><span style="color:var(--roxo);font-size:1.2rem">'+a.q+'</span></span>';
      d.onclick=()=>{if(d.classList.contains('certa'))return;
        if(a.q>=7){d.classList.add('certa');achou++;tocarSom(true);falar(a.n+', '+a.q+'!');
          if(achou===2){fb.textContent='⭐ CACHORRO E GATO!';fb.className='feedback certo';
            setTimeout(()=>falar('Cachorro e gato são os que mais aparecem! '+elogio()),600);
            setTimeout(()=>fimDeJogo(18),3200);}
          else{fb.textContent='⭐ ACHE MAIS UM!';fb.className='feedback certo';}}
        else{d.classList.add('errada');tocarSom(false);falar('Olhe os números maiores');
          fb.textContent='OLHE OS NÚMEROS MAIORES 💪';fb.className='feedback tente';
          setTimeout(()=>d.classList.remove('errada'),450);}};
      ops.appendChild(d);});
    area.appendChild(ops);
    textoFala='Quais são os dois animais que mais aparecem? Olhe os números maiores.';falar(textoFala);}}

function proxJ18(){
  if(fase18===0){rod18++;
    if(rod18>=PESQ.length){fase18=1;}
  }else fase18++;
  montarJ18();}

/* ============ JOGO 19 — CA pág.15: o gráfico dos animais ============ */
const CORES19={CACHORRO:'#42A5F5',GATO:'#FFA726',TARTARUGA:'#66BB6A',COELHO:'#EC407A'};
let fase19=0, rod19m=0, pint19=0;

function graficoHTML(pintados){
  let h='<div class="grafico"><div style="text-align:center;font-weight:bold;margin-bottom:6px">ANIMAIS DE ESTIMAÇÃO</div>';
  [...PESQ].reverse().forEach(a=>{
    h+='<div class="g-linha"><span class="g-rot">'+a.n+'</span><span class="g-cels">';
    for(let k=1;k<=10;k++){
      const cheio=(pintados[a.n]||0)>=k;
      h+='<span class="g-cel'+(cheio?' pint':'')+'" data-a="'+a.n+'" data-k="'+k+'"'+
         (cheio?' style="background:'+CORES19[a.n]+'"':'')+'></span>';}
    h+='</span></div>';});
  h+='<div class="g-eixo">';
  for(let k=1;k<=10;k++)h+='<span>'+k+'</span>';
  return h+'</div></div>';}

function abrirJogo19(){fase19=0;rod19m=0;pint19=0;mostrar('tela-j19');montarJ19m();}

function montarJ19m(){
  const perg=document.getElementById('perg-j19'),area=document.getElementById('area-j19'),
        fb=document.getElementById('fb-j19'),prox=document.getElementById('prox-j19');
  area.innerHTML='';fb.textContent='';fb.className='feedback';prox.classList.remove('mostrar');
  estrelas(document.getElementById('prog-j19'),fase19===0?rod19m:4+fase19-1,8);

  const prontos={};
  PESQ.forEach((a,i)=>{if(fase19>0||i<rod19m)prontos[a.n]=a.q;});

  if(fase19===0){                        /* pintar a barra de cada animal */
    const a=PESQ[rod19m];pint19=0;
    perg.innerHTML='PINTE <b>'+a.q+' QUADRINHOS</b> DO '+a.ic+' '+a.n;
    const g=document.createElement('div');g.innerHTML=graficoHTML(prontos);area.appendChild(g);
    g.querySelectorAll('.g-cel').forEach(c=>{
      if(c.dataset.a!==a.n)return;
      c.onclick=()=>{if(c.classList.contains('pint'))return;
        const k=parseInt(c.dataset.k);
        if(k!==pint19+1){tocarSom(false);falar('Pinte na ordem, da esquerda para a direita');
          fb.textContent='PINTE EM ORDEM 💪';fb.className='feedback tente';return;}
        c.classList.add('pint');c.style.background=CORES19[a.n];
        pint19++;tocarSom(true);falar(String(pint19));
        if(pint19===a.q){fb.textContent='⭐ BARRA DO '+a.n+' PRONTA!';fb.className='feedback certo';
          prox.classList.add('mostrar');
          prox.textContent=(rod19m>=PESQ.length-1)?'VER O GRÁFICO ➜':'PRÓXIMO ANIMAL ➜';}
        else if(pint19>a.q){}};});
    textoFala='Pinte '+a.q+' quadrinhos do '+a.n+', um de cada vez.';falar(textoFala);}

  else{                                   /* perguntas sobre o gráfico */
    const PERG19=[
     {t:'QUAL ANIMAL HÁ EM <b>MAIOR</b> QUANTIDADE?',ok:'CACHORRO',
      fala:'Qual animal há em maior quantidade? Olhe a barra mais comprida.',ops:['CACHORRO','GATO','COELHO']},
     {t:'E EM <b>MENOR</b> QUANTIDADE?',ok:'COELHO',
      fala:'E em menor quantidade? Olhe a barra mais curtinha.',ops:['COELHO','TARTARUGA','GATO']},
     {t:'ENTRE O <b>GATO</b> E O <b>COELHO</b>,<br>QUAL É O PREFERIDO DAS PESSOAS?',ok:'GATO',
      fala:'Entre o gato e o coelho, qual as pessoas preferem?',ops:['GATO','COELHO']},
     {t:'QUANTOS <b>CACHORROS A MAIS</b><br>QUE TARTARUGAS?',ok:'5',num:true,
      fala:'Quantos cachorros há a mais que tartarugas? Conte os quadrinhos que sobram.',ops:['5','3','7']},
     {t:'QUANTOS ANIMAIS <b>AO TODO</b>?<br><small style="font-size:1rem">9 + 7 + 4 + 2</small>',ok:'22',num:true,
      fala:'Quantos animais há no total? Nove mais sete mais quatro mais dois.',ops:['22','20','24']}
    ];
    const q=PERG19[fase19-1];
    perg.innerHTML=q.t;
    const g=document.createElement('div');g.innerHTML=graficoHTML(prontos);area.appendChild(g);
    const ops=document.createElement('div');ops.className=q.num?'num-ops':'silaba-ops';
    embaralhar8([...q.ops]).forEach(v=>{const b=document.createElement('button');
      b.className=q.num?'num-btn':'sil';b.textContent=v;
      b.onclick=()=>{if(v===q.ok){tocarSom(true);falar(v+'! '+elogio());
          fb.textContent='⭐ '+v;fb.className='feedback certo';
          ops.querySelectorAll('button').forEach(x=>x.onclick=null);
          fase19++;
          if(fase19>PERG19.length)setTimeout(()=>fimDeJogo(19),2600);
          else setTimeout(()=>montarJ19m(),2600);}
        else{b.classList.add('errada');tocarSom(false);falar('Olhe o gráfico de novo');
          fb.textContent='OLHE O GRÁFICO 💪';fb.className='feedback tente';
          setTimeout(()=>b.classList.remove('errada'),450);}};
      ops.appendChild(b);});
    area.appendChild(ops);
    textoFala=q.fala;falar(textoFala);}}

function proxJ19(){
  if(fase19===0){rod19m++;
    if(rod19m>=PESQ.length)fase19=1;}
  montarJ19m();}
