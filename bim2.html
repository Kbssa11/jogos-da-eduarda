<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;font-family:'Comic Sans MS','Chalkboard SE','Segoe UI',sans-serif;color:#4A3B69;}
  body{min-height:100vh;background:
    radial-gradient(circle at 10% 5%, #FFECB3 0 90px, transparent 91px),
    radial-gradient(circle at 92% 12%, #B3E5FC 0 70px, transparent 71px),
    radial-gradient(circle at 88% 90%, #F8BBD0 0 80px, transparent 81px),
    radial-gradient(circle at 8% 92%, #C8E6C9 0 60px, transparent 61px),
    #FDF6FF;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  h1{font-size:2.2rem;color:#7E57C2;text-align:center;margin:0 0 6px;letter-spacing:1px;}
  .sub{color:#8E7CC3;font-size:1.1rem;margin:0 0 30px;text-align:center;}
  a.materia{display:flex;align-items:center;gap:18px;width:100%;max-width:440px;text-decoration:none;
    border-radius:26px;padding:22px 24px;margin:12px 0;font-size:1.5rem;font-weight:bold;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .1s;}
  a.materia:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.18);}
  a.materia .emo{font-size:2.8rem;}
  .mat{background:#29B6F6;}
  .por{background:#66BB6A;}
  .cie{background:#26A69A;}
  .geo{background:#FB8C00;}
  .his{background:#AB47BC;}
  .men{background:#EF5350;}
  .estrela{font-size:2.6rem;margin-top:26px;animation:brilha 2.4s ease-in-out infinite;}
  @keyframes brilha{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.18);opacity:1}}
  @media (prefers-reduced-motion: reduce){.estrela{animation:none;}}
  .bim{display:flex;align-items:center;gap:20px;width:100%;max-width:460px;text-decoration:none;
    border-radius:30px;padding:30px 26px;margin:14px 0;font-size:1.9rem;font-weight:bold;color:#fff;
    box-shadow:0 8px 0 rgba(0,0,0,.18);transition:transform .1s;line-height:1.15;}
  .bim:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.18);}
  .bim .emo{font-size:3.4rem;}
  .bim small{display:block;font-size:1rem;font-weight:normal;margin-top:4px;}
  .b1{background:#7E57C2;} .b2{background:#26A69A;}
  a.voltar-ini{align-self:flex-start;text-decoration:none;background:#EDE7F6;color:#5E35B1;font-weight:bold;
    font-size:1.1rem;padding:10px 18px;border-radius:16px;box-shadow:0 3px 0 #D1C4E9;margin-bottom:10px;}
</style>
